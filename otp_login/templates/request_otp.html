<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request OTP</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 15px; }
        input[type="email"] { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #0056b3; color: white; border: none; cursor: pointer; }
        .messages { color: red; margin-bottom: 15px; list-style-type: none; padding: 0; }
    </style>
</head>
<body>

    <h2>Login</h2>
    
    <!-- This section displays errors, like "No user found with this email address." -->
    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <!-- The Input System for Email -->
    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label for="email">Enter your email address:</label>
            <input type="email" id="email" name="email" placeholder="e.g., user@example.com" required>
        </div>
        <button type="submit">Send OTP</button>
    </form>

</body>
</html>
